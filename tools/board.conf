# Configuración del board. Va versionada para que nadie tenga que exportar variables.
# Formato KEY=valor. Una variable de entorno con el mismo nombre la reemplaza.

# Repo (owner/nombre) donde vive el issue del board. Vacío = el remoto origin.
# En Platanus conviene el repo personal espejo (puede ser privado), no el de la org, que es público.
BOARD_REPO=

# Número del issue fijado que hace de board.
BOARD_ISSUE=1

# Logins de GitHub del equipo, separados por espacios. Solo se muestran sus posts.
# Si queda vacío, los agentes leen comentarios de cualquier cuenta de GitHub.
BOARD_TEAM=Terdmannsdorffer
