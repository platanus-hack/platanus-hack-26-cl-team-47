<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor del registro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>Visor del registro</h1>
    <div class="controls" role="toolbar" aria-label="Reproducción">
      <button id="btn-start" title="Volver al inicio">⏮</button>
      <button id="btn-back" title="Paso atrás">◀</button>
      <button id="btn-play" title="Reproducir">▶</button>
      <button id="btn-pause" title="Pausar">⏸</button>
      <button id="btn-fwd" title="Paso adelante">▶︎|</button>
      <div class="speed" role="group" aria-label="Velocidad">
        <button data-speed="1" class="active">1×</button>
        <button data-speed="4">4×</button>
        <button data-speed="16">16×</button>
      </div>
      <span id="position" class="position">—</span>
    </div>
    <label class="file">
      Abrir registro… <input id="file" type="file" accept=".jsonl,.json,.txt">
    </label>
  </header>

  <main class="grid">
    <section class="panel calls">
      <h2>Llamadas</h2>
      <ol id="call-list"></ol>
    </section>

    <section class="panel chart">
      <h2>Bits filtrados por secreto</h2>
      <div id="chart-bits" class="chart-box"></div>
    </section>

    <section class="panel chart">
      <h2>Evidencia de ataque (S)</h2>
      <div id="chart-s" class="chart-box"></div>
    </section>

    <section class="panel detail">
      <h2>Llamada actual</h2>
      <div id="detail"><p class="muted">Carga un registro con <code>?log=…</code> o con el botón.</p></div>
    </section>
  </main>

  <script src="vendor/d3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
